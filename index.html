<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --purple:#534AB7;

  --purple-mid:#AFA9EC;
  --purple-dark:#3C3489;

  --text-sub:#555;

body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:var(--bg-s);color:var(--text);min-height:100vh;}

/* ===== LOGIN ===== */
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;}

.login-logo{text-align:center;margin-bottom:24px;}
.login-logo-title{font-size:18px;font-weight:600;letter-spacing:0.12em;color:var(--purple-dark);}
.login-logo-sub{font-size:11px;color:var(--text-hint);margin-top:6px;letter-spacing:0.04em;}
.form-label{font-size:12px;color:var(--text-sub);margin-bottom:6px;display:block;}
input[type=email],input[type=text]{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;color:var(--text);background:var(--bg);margin-bottom:14px;font-family:inherit;}
input:focus{outline:none;border-color:var(--purple-mid);}
.login-btn{width:100%;padding:13px;background:var(--purple);border:none;border-radius:var(--radius);color:#fff;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:0.04em;}
.login-btn:active{opacity:.8;}
.login-btn:disabled{opacity:.5;cursor:default;}
.step-note{font-size:12px;color:var(--text-hint);text-align:center;margin-top:12px;line-height:1.6;}
.msg-box{padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:14px;line-height:1.5;}
.msg-ok{background:var(--green-bg);color:var(--green-text);}
.msg-err{background:var(--red-bg);color:var(--red-text);}

/* ===== MAIN APP ===== */
.app-wrap{display:none;}

.label{font-size:11px;color:var(--text-hint);letter-spacing:0.06em;margin-bottom:8px;}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;}

.pcard-sub{font-size:11px;color:var(--text-hint);margin-top:2px;line-height:1.4;}

textarea{padding:12px;resize:none;line-height:1.7;}
select:focus,textarea:focus{outline:none;border-color:var(--purple-mid);}
.hint-text{font-size:11px;color:var(--text-hint);margin-top:6px;line-height:1.6;}
.gen-btn{width:100%;padding:15px;background:var(--purple);border:none;border-radius:var(--radius);color:#fff;font-size:15px;font-weight:600;cursor:pointer;letter-spacing:0.04em;}

.divider{height:1px;background:var(--border);margin:24px 0;}

.out-section.visible{display:block;}

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwOK5F9nXh_pRT37q2zmnEtOKSoTdg8x5DTpxzL4aH1xXGA7m-0-xbNhZha0nWGvHX3HA/exec';

/* ===== AUTH ===== */
let currentEmail = '';
let currentToken = '';

function showMsg(msg, type){
  const el = document.getElementById('loginMsg');
  el.innerHTML = msg ? `<div class="msg-box msg-${type}">${msg}</div>` : '';
}

async function sendOtp(){
  const email = document.getElementById('emailInput').value.trim();
  if(!email){ showMsg('メールアドレスを入力してください', 'err'); return; }
  const btn = document.querySelector('#step1 .login-btn');
  btn.disabled = true; btn.textContent = '送信中…';
  showMsg('', '');
  try{
    const res = await fetch(GAS_URL, {
      method:'POST',
      body: JSON.stringify({action:'sendOtp', email})
    });
    const d = await res.json();
    if(d.ok){
      currentEmail = email;
      document.getElementById('step1').style.display = 'none';
      document.getElementById('step2').style.display = 'block';
      showMsg('認証コードを送信しました', 'ok');
    } else {
      showMsg(d.msg || '登録されていないメールアドレスです', 'err');
    }
  } catch(e){
    showMsg('通信エラーが発生しました', 'err');
  }
  btn.disabled = false; btn.textContent = '認証コードを送信';
}

async function verifyOtp(){
  const otp = document.getElementById('otpInput').value.trim();
  if(otp.length !== 6){ showMsg('6桁のコードを入力してください', 'err'); return; }
  const btn = document.querySelector('#step2 .login-btn');
  btn.disabled = true; btn.textContent = '確認中…';
  showMsg('', '');
  try{
    const res = await fetch(GAS_URL, {
      method:'POST',
      body: JSON.stringify({action:'verifyOtp', email:currentEmail, otp})
    });
    const d = await res.json();
    if(d.ok){
      currentToken = d.token;
      sessionStorage.setItem('sns_token', d.token);
      sessionStorage.setItem('sns_email', currentEmail);
      startApp();
    } else {
      showMsg('コードが正しくありません。もう一度お試しください', 'err');
    }
  } catch(e){
    showMsg('通信エラーが発生しました', 'err');
  }
  btn.disabled = false; btn.textContent = 'ログイン';
}

function resetLogin(){
  document.getElementById('step1').style.display = 'block';
  document.getElementById('step2').style.display = 'none';
  document.getElementById('otpInput').value = '';
  showMsg('', '');
}

function logout(){
  sessionStorage.removeItem('sns_token');
  sessionStorage.removeItem('sns_email');
  location.reload();
}

function startApp(){
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('appWrap').style.display = 'block';
  const email = sessionStorage.getItem('sns_email') || currentEmail;
  document.getElementById('userLabel').textContent = email + '　';
}

window.addEventListener('DOMContentLoaded', () => {
  const t = sessionStorage.getItem('sns_token');
  const e = sessionStorage.getItem('sns_email');
  if(t && e){ currentToken = t; currentEmail = e; startApp(); }
});

/* ===== APP LOGIC ===== */
let platform='instagram', purpose='attract', tone='warm';
let currentTpl = null;

document.getElementById('platformRow').addEventListener('click',e=>{
  const t=e.target.closest('[data-v]');
  if(!t)return;
  platform=t.dataset.v;
  document.querySelectorAll('#platformRow [data-v]').forEach(c=>c.classList.remove('active'));
  t.classList.add('active');
});

document.getElementById('purposeGrid').addEventListener('click',e=>{
  const t=e.target.closest('[data-v]');
  if(!t)return;
  purpose=t.dataset.v;
  document.querySelectorAll('#purposeGrid [data-v]').forEach(c=>c.classList.remove('active'));
  t.classList.add('active');
  updateHint();
});

document.getElementById('toneSelect').addEventListener('change',e=>{ tone=e.target.value; });

const HINTS={
  attract:'例：お腹に手を当てると変わること・五臓の疲れが腹部に出る話・整う感覚について',
  trust:'例：腹診とは・安心する手あて・ポリヴェーガルと腹部の関係・五臓の読み方',
  announce:'例：腹部コースの内容・受講生の変化・学びの気づき',
  daily:'例：今日の施術エピソード・自分のお腹のケア・セラピストの日常'
};

function updateHint(){
  document.getElementById('hintText').textContent = HINTS[purpose]||'※ 空欄でも自動生成されます';
}

const PURPOSE_LBL={attract:'集客・認知',trust:'信頼・教育',announce:'講座・告知',daily:'日常・共感'};
const PURPOSE_CLS={attract:'#E1F5EE',trust:'#E6F1FB',announce:'#FAEEDA',daily:'#FBEAF0'};
const PURPOSE_TXT={attract:'#085041',trust:'#0C447C',announce:'#633806',daily:'#72243E'};

function generate(){
  const theme=document.getElementById('themeInput').value.trim();
  let pool=T[purpose]?.[tone]||T[purpose]?.warm||[];
  if(!pool||pool.length===0){
    const k=Object.keys(T[purpose]||{})[0];
    pool=k?T[purpose][k]:[];
  }
  let tpl;
  if(!pool||pool.length===0){
    tpl={hook:'腹部施術を通じて\nお客様のからだに向き合う毎日です。',body:'丁寧に、ていねいに。\nそれだけを心がけています。\n\nお腹に手を当てるとき\nからだが教えてくれることがあります。\n\nその声に耳を傾けながら\n施術を続けています。',cta:'ご相談はお気軽にDMください。'};
  } else {
    const idx=Math.floor(Math.random()*pool.length);
    tpl=JSON.parse(JSON.stringify(pool[idx]));
    if(theme){ tpl.body=theme+'\n\n'+tpl.body; }
  }
  currentTpl=tpl;
  const foot=platform==='instagram'?FOOTER_IG:FOOTER_TH;
  const full=tpl.hook+'\n\n'+tpl.body+'\n\n'+tpl.cta+'\n\n'+foot;
  document.getElementById('outHook').textContent=tpl.hook;
  document.getElementById('outBody').textContent=tpl.body;
  document.getElementById('outCta').textContent=tpl.cta;
  document.getElementById('outCaption').textContent=full;
  document.getElementById('outBadge').innerHTML=
    `<span class="badge" style="background:var(--purple-light);color:var(--purple-dark);">澪花 腹部コース</span>`+
    `<span class="badge" style="background:${PURPOSE_CLS[purpose]};color:${PURPOSE_TXT[purpose]};">${PURPOSE_LBL[purpose]}</span>`+
    `<span class="badge" style="background:var(--bg-s);color:var(--text-sub);">${platform==='instagram'?'Instagram':'Threads'}</span>`;
  const btn=document.getElementById('copyBtn');
  btn.textContent='コピーする'; btn.className='copy-btn';
  document.getElementById('saveBtn').disabled=false;
  document.getElementById('saveNote').textContent='';
  document.getElementById('outSection').classList.add('visible');
  document.getElementById('outSection').scrollIntoView({behavior:'smooth',block:'start'});
}

function copyCaption(){
  const text=document.getElementById('outCaption').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.getElementById('copyBtn');
    btn.textContent='コピーしました';
    btn.classList.add('copy-ok');
    setTimeout(()=>{btn.textContent='コピーする';btn.classList.remove('copy-ok');},2500);
  });
}

async function saveToSheet(){
  if(!currentTpl)return;
  const btn=document.getElementById('saveBtn');
  btn.disabled=true; btn.textContent='保存中…';
  const payload={
    action:'save',
    token:currentToken,
    email:currentEmail,
    platform,
    purpose:PURPOSE_LBL[purpose],
    tone:document.getElementById('toneSelect').options[document.getElementById('toneSelect').selectedIndex].text,
    theme:document.getElementById('themeInput').value.trim(),
    hook:currentTpl.hook,
    body:currentTpl.body,
    cta:currentTpl.cta,
    caption:document.getElementById('outCaption').textContent,
    saved_at:new Date().toLocaleString('ja-JP')
  };
  try{
    const res=await fetch(GAS_URL,{method:'POST',body:JSON.stringify(payload)});
    const d=await res.json();
    if(d.ok){
      document.getElementById('saveNote').textContent='保存しました';
      document.getElementById('saveNote').style.color='var(--green-text)';
    } else {
      document.getElementById('saveNote').textContent='保存に失敗しました';
      document.getElementById('saveNote').style.color='var(--red-text)';
    }
  } catch(e){
    document.getElementById('saveNote').textContent='通信エラーが発生しました';
    document.getElementById('saveNote').style.color='var(--red-text)';
  }
  btn.disabled=false; btn.textContent='スプレッドシートに保存';
}

updateHint();
</script>
